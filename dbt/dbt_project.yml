name: fooddel
version: "1.0.0"
config-version: 2
profile: fooddel

model-paths: ["models"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: target
clean-targets: [target, dbt_packages]

vars:
  # fct_orders re-merges orders whose latest event was emitted within this window. Late events
  # in the simulator arrive up to 6 h late, so 24 h covers them with margin.
  incremental_lookback_hours: 24
  # ETA model: time-based split by IST placement date (P6, ADR 0006)
  eta_train_end: "2026-09-15"
  eta_valid_end: "2026-09-30"
  eta_test_end: "2026-10-09"

models:
  fooddel:
    +query_tag: dbt
    staging:
      +schema: STAGING
      +materialized: view
    intermediate:
      +schema: STAGING
      +materialized: table
    marts:
      +schema: MARTS
      +materialized: table
    ml:
      +schema: ML
      +materialized: table
    # Consumers' only door into MARTS: secure views (definition hidden, PII masked, zone rows
    # filtered). Grants re-applied by dbt on every build.
    secure:
      +schema: MARTS_SECURE
      +materialized: view
      +secure: true
      +grants:
        select: [FOODDEL_BI, FOODDEL_OPS_WEST, FOODDEL_OPS_EAST]

seeds:
  fooddel:
    +schema: MARTS

snapshots:
  fooddel:
    +schema: STAGING
