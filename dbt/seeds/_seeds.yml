version: 2

seeds:
  - name: zones
    description: Generated by scripts/gen_zone_seeds.py from simulator/data/pune_zones.yaml.
    config:
      column_types:
        DEMAND_WEIGHT: FLOAT
        CENTER_LAT: FLOAT
        CENTER_LNG: FLOAT
        H3_CELL_COUNT: NUMBER
  - name: zone_cells
    description: H3 res-8 cell -> zone mapping (generated with zones.csv).
    columns:
      - name: H3_R8
        data_tests: [unique, not_null]
