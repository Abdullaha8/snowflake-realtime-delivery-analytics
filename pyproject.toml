[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fooddel"
version = "0.1.0"
description = "Real-time food delivery analytics platform (Pune) - event simulator and data pipeline"
requires-python = ">=3.11,<3.12"
dependencies = [
    "h3>=4.1,<5",
    "faker>=30",
    "pydantic>=2.7,<3",
    "pyyaml>=6",
]

[project.optional-dependencies]
kafka = ["confluent-kafka[avro]>=2.5"]
snowflake = ["snowflake-connector-python>=3.12"]
dev = ["pytest>=8", "ruff>=0.6", "black>=24", "sqlfluff>=3"]

[tool.setuptools]
packages = ["simulator", "simulator.data"]

[tool.setuptools.package-data]
"simulator.data" = ["*.yaml"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # black owns line length

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = ["integration: needs the local docker stack (make up); run with make test-integration"]
